# ai_cover 配置文件：改完直接运行  python main.py  (或 python main.py -c 其他.yaml)

input_video: "D:/videos/demo.mp4"     # 输入视频路径
output_dir: "output"                   # 输出根目录，每个视频会建一个子目录
resume: true                           # true: 中间产物已存在则跳过该步骤；false: 全部重跑

ffmpeg: "ffmpeg"                       # ffmpeg 可执行文件，不在 PATH 就写完整路径

separation:                            # 人声 / 伴奏分离 (Demucs)
  model: "htdemucs"                    # 可选 htdemucs / htdemucs_ft(更好更慢) / mdx_extra
  device: "cuda"                       # cuda 或 cpu

rvc:                                   # 人声克隆 (RVC 推理)
  model_path: "D:/models/my_voice.pth" # 训练好的 RVC 模型 .pth
  index_path: "D:/models/my_voice.index"  # 可为空 ""，不用检索索引
  version: "v2"                        # 模型版本 v1 / v2
  device: "cuda:0"
  f0_method: "rmvpe"                   # rmvpe / harvest / crepe / pm
  f0_up_key: 0                         # 变调(半音)，男转女约 +12，女转男约 -12
  index_rate: 0.5                      # 0~1，越大越像目标音色，过大会有杂音
  protect: 0.33                        # 0~0.5，保护清辅音/呼吸声，越小保护越强
  filter_radius: 3
  rms_mix_rate: 0.25
  resample_sr: 0                       # 0 表示使用模型原采样率

mix:                                   # 混音
  vocal_volume: 1.0                    # 转换后人声音量倍数
  accompaniment_volume: 1.0            # 伴奏音量倍数
  sample_rate: 44100
  loudnorm: true                       # 混音后做响度标准化

output:
  filename: ""                         # 为空则 <原文件名>_cover.mp4
  audio_bitrate: "256k"
